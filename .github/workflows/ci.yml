# Typecheck, lint (Biome and Obsidian's own review rules), test and build, on every push to
# `main` and every pull request. Actions are pinned by commit, not tag: a moved tag would
# run someone else's code here.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Its own job, so it reports as its own status and a failure here does not hide the
  # results below. `.github/scripts/check-pins.sh` says what it accepts and why.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/check-pins.sh
  check:
    runs-on: ubuntu-latest
    steps:
      # No token left in `.git/config` for the install and build scripts that run after.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node runs the build (`node esbuild.config.mjs`) and the test runner, so it is pinned
      # too, not left to the runner's default: the current 24 LTS, matching `@types/node`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # `packageManager`, so the workflow and the manifest cannot name two versions.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      # Refuses in the pull request what the release job would refuse after the merge:
      # a bad version, versions.json or CHANGELOG.md, or shipped files that changed
      # without a version bump. See RELEASING.md.
      - run: node tools/release.mjs check
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  # A release is two jobs (RELEASING.md). This one builds and decides with a read-only
  # token, so no dependency code (install scripts, the build) ever runs beside a token that
  # can write. It only runs on a push to `main`: never on a pull request.
  release-build:
    needs: [pins, check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Sets `version` only when this push releases one; otherwise everything below skips.
      - id: plan
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          node tools/release.mjs plan --notes "$RUNNER_TEMP/release/notes.md"
          cp main.js manifest.json "$RUNNER_TEMP/release/"
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before }}
      - if: steps.plan.outputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  # The only job with write access. It installs and builds nothing: it takes the build's
  # files, replaces a draft a dead run left, attests, tags the commit and publishes.
  release-publish:
    needs: release-build
    if: needs.release-build.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release-build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only what this job runs: no dependency code is on disk beside the write token.
          sparse-checkout: |
            tools/release.mjs
            .node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - run: node tools/release.mjs publish "$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
      - run: >
          gh release create "$VERSION" dist/main.js dist/manifest.json
          --target "$GITHUB_SHA" --title "$VERSION" --notes-file dist/notes.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
