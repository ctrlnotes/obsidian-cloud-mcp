# Keeps the pinned GitHub Actions and the bun dependencies current, one grouped pull
# request per ecosystem per week. Each action is pinned by commit with its version in a
# trailing comment, and Dependabot updates both.
#
# `eslint-plugin-obsidianmd` is pinned exactly on purpose: it is the community directory's
# own review rule set, and a new rule should arrive as a pull request here, where CI shows
# what it finds, not as a surprise at the next release's review.
#
# `cooldown` waits a week after a release before proposing it, so a compromised release
# that is pulled within days never reaches this repository. Security updates are not
# delayed by it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # `typescript` is the 6.x that typescript-eslint loads: it supports TypeScript below 6.1
      # only (peer `>=4.8.4 <6.1.0` in 8.70.1), because 7.0 ships no compiler API
      # (typescript-eslint#10940, expected with 7.1). TypeScript 7 type-checks the code as
      # `@typescript/native` (see tsconfig.json). Remove this once typescript-eslint supports 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # The types describe the Node that runs the build and tests: `.node-version`, 24 LTS.
      # Move them to a new major together with `.node-version`, never alone.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Everything but Obsidian's review rules, together.
      dependencies:
        patterns: ["*"]
        exclude-patterns: ["eslint-plugin-obsidianmd"]
      # Alone, so a new rule that CI flags holds back only itself.
      obsidian-review-rules:
        patterns: ["eslint-plugin-obsidianmd"]
    commit-message:
      prefix: "Deps"
