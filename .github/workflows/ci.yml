# Typecheck, lint (Biome and Obsidian's own review rules) and build, on every push to
# `main` and every pull request. Actions are pinned by commit, not tag: a moved tag would
# run someone else's code here.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Its own job, so it reports as its own status and a failure here does not hide the
  # results below. `.github/scripts/check-pins.sh` says what it accepts and why.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/check-pins.sh
  check:
    runs-on: ubuntu-latest
    steps:
      # No token left in `.git/config` for the install and build scripts that run after.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # `packageManager`, so the workflow and the manifest cannot name two versions.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
