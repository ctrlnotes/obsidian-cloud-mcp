# Typecheck, lint (Biome and Obsidian's own review rules) and build, on every push and
# pull request. The test suite runs in the private monorepo this is published from.
# Actions are pinned by commit, not tag: a moved tag would run someone else's code here.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # `packageManager`, so the workflow and the manifest cannot name two versions.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
